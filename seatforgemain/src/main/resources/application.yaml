spring:
  application:
    name: seatforge
  datasource:
    url: ${SEATFORGE_DATABASE_URL:jdbc:postgresql://localhost:5432/seatforge}
    username: ${SEATFORGE_DATABASE_USERNAME:seatforge}
    password: ${SEATFORGE_DATABASE_PASSWORD:seatforge}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    table: flyway_schema_history
    validate-migration-naming: true
    clean-disabled: true
    connect-retries: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER}
          audiences: ${AUTH0_AUDIENCE}
          jws-algorithms: RS256

seatforge:
  payments:
    max-delay-ms: ${SEATFORGE_PAYMENT_MAX_DELAY_MS:30000}
  inventory:
    reservation-ttl: ${SEATFORGE_RESERVATION_TTL:PT10M}
    expiration:
      enabled: ${SEATFORGE_EXPIRATION_ENABLED:true}
      batch-size: ${SEATFORGE_EXPIRATION_BATCH_SIZE:100}
      fixed-delay: ${SEATFORGE_EXPIRATION_FIXED_DELAY:PT30S}
      initial-delay: ${SEATFORGE_EXPIRATION_INITIAL_DELAY:PT30S}
