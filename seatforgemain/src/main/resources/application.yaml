spring:
  application:
    name: seatforge
  datasource:
    url: ${SEATFORGE_DATABASE_URL:jdbc:postgresql://localhost:5432/seatforge}
    username: ${SEATFORGE_DATABASE_USERNAME:seatforge}
    password: ${SEATFORGE_DATABASE_PASSWORD:seatforge}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    table: flyway_schema_history
    validate-migration-naming: true
    clean-disabled: true
    connect-retries: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER}
          audiences: ${AUTH0_AUDIENCE}
          jws-algorithms: RS256
